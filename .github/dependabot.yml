# Weekly dependency updates: the Angular packages come in one group, so they update together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @angular/build accepts only TypeScript 6.0.x (peer range >=6.0 <6.1), so a newer
      # TypeScript breaks `npm ci`. Patch updates are fine; revisit when Angular moves on.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
      playwright:
        patterns:
          - '@playwright/test'
          - '@axe-core/playwright'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
