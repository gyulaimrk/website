name: Links

# Weekly check that the external links on the site (projects, certificates, profiles) are alive.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Read-only by default; the deploy gets the Cloudflare secrets separately.
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check external links
        run: npm run links
