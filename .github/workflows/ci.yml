name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Havonta újraépül és telepít, hogy a tapasztalat évei (5+, 3+…) az előrenderelt oldalon is frissüljenek.
  schedule:
    - cron: '23 5 1 * *'

jobs:
  build:
    # Rögzített futtató: az ubuntu-latest már 26.04, amit a Playwright 1.56 nem támogat.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-output
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/portfolio/browser

  deploy:
    # Csak a main ágon fut, és csak ha a Cloudflare titkok be vannak állítva.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pontosan azt telepítjük, amit a build job már legyártott és letesztelt.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/portfolio/browser
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
