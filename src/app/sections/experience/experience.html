<section id="tapasztalat">
  <app-section-heading
    title="Tapasztalat"
    lead="Három cég, négy szerep: junior fejlesztőként kezdtem, ma senior vagyok."
  />
  <ol>
    @for (job of jobs; track job.company + job.period; let i = $index) {
      <li appReveal>
        <app-job-card [job]="job" [current]="i === 0" />
      </li>
    }
  </ol>
</section>
