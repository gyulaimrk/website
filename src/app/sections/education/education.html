<section id="tanulmanyok">
  <app-section-heading
    [title]="content().ui.education.title"
    [lead]="content().ui.education.lead"
  />
  <div class="grid">
    <app-card appReveal>
      <h3>{{ content().ui.education.studies }}</h3>
      <ul>
        @for (study of education(); track study.title) {
          <li>
            <strong>{{ study.title }}</strong>
            <span>{{ study.where }}, {{ study.period }}</span>
          </li>
        }
      </ul>
    </app-card>
    <app-card appReveal="2">
      <h3>{{ content().ui.education.certificates }}</h3>
      <ul>
        @for (study of certificates(); track study.title) {
          <li>
            <strong>{{ study.title }}</strong>
          </li>
        }
      </ul>
    </app-card>
  </div>
</section>
