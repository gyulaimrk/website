<section id="tanulmanyok">
  <app-section-heading
    title="Tanulmányok és tanúsítványok"
    lead="Egyetemen kezdtem, azóta tanfolyamokkal és tanúsítványokkal tartom frissen a tudásomat."
  />
  <div class="grid">
    <app-card appReveal>
      <h3>Tanulmányok</h3>
      <ul>
        @for (study of education; track study.title) {
          <li>
            <strong>{{ study.title }}</strong>
            <span>{{ study.where }}, {{ study.period }}</span>
          </li>
        }
      </ul>
    </app-card>
    <app-card appReveal="2">
      <h3>Tanúsítványok</h3>
      <ul>
        @for (study of certificates; track study.title) {
          <li>
            <strong>{{ study.title }}</strong>
          </li>
        }
      </ul>
    </app-card>
  </div>
</section>
