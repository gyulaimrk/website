<app-card>
  <h3>{{ project().name }}</h3>
  <p class="description">{{ project().description }}</p>
  <app-chip-list [items]="project().tech" />
  <div class="links">
    @if (project().url; as url) {
      <a appButton variant="ghost" [external]="true" [href]="url">
        {{ content().ui.sideProjects.visit }}
      </a>
    }
    @if (project().sourceUrl; as sourceUrl) {
      <a appButton variant="ghost" [external]="true" [href]="sourceUrl">
        {{ content().ui.sideProjects.source }}
      </a>
    }
  </div>
</app-card>
