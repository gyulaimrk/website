<section id="kapcsolat">
  <app-island tone="foam" [shape]="2">
    <h2>Dolgozzunk együtt</h2>
    <p>
      Új projektben, AI-bevezetésben vagy backend fejlesztésben gondolkodsz? Írj, szívesen
      beszélgetek róla.
    </p>
    <div class="actions">
      <a appButton [external]="true" [href]="profile.linkedin">Írj a LinkedInen</a>
      <a appButton variant="ink" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    </div>
    <p class="where">{{ profile.location }}</p>
  </app-island>
</section>
