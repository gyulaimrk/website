<section id="kapcsolat">

    <h2>Dolgozzunk együtt</h2>
    <p>
      Van egy projekted, AI-ötleted vagy backend feladatod? Írj nekem, szívesen átbeszélem veled.
    </p>
    <div class="actions">
      <a appButton [external]="true" [href]="profile.linkedin">Írj a LinkedInen</a>
      <a appButton variant="ghost" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    </div>
  </div>
</section>
