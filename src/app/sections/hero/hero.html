<section id="top">
  <h1>{{ profile.headline }}</h1>
  <p class="lead">{{ profile.intro }}</p>
  <a appButton class="cta" [external]="true" [href]="profile.linkedin">Beszéljünk</a>
  <div class="islands">
    <app-island class="java" tone="coral" [shape]="1">
      <p class="big">Java</p>
      <p>A 8-as verziótól a 25-ösig magabiztosan.</p>
    </app-island>
    <app-island class="kotlin" tone="sun" [shape]="2">
      <p class="big">Kotlin</p>
      <p>Az Adroit Group projektjein.</p>
    </app-island>
  </div>
</section>
