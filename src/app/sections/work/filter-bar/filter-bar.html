<div role="group" aria-label="Szűrés technológia szerint">
  <button
    type="button"
    [class.on]="!selected()"
    [attr.aria-pressed]="!selected()"
    (click)="selected.set(null)"
  >
    Mind
  </button>
  @for (option of options(); track option) {
    <button
      type="button"
      [class.on]="selected() === option"
      [attr.aria-pressed]="selected() === option"
      (click)="toggle(option)"
    >
      {{ option }}
    </button>
  }
</div>
