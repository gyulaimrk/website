<section id="eszkoztar">
  <app-section-heading>Eszköztár</app-section-heading>
  <div class="group">
    @for (skill of skills; track skill.title; let i = $index) {
      <app-island
        class="islet"
        [class.big]="skill.highlight"
        [tone]="toneFor(skill, i)"
        [shape]="shapeFor(i)"
      >
        <h3>{{ skill.title }}</h3>
        <p class="tag">{{ skill.tag }}</p>
        <p>{{ skill.text }}</p>
      </app-island>
    }
  </div>
</section>
