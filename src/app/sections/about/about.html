<section id="rolam">
  <app-section-heading
    title="Rólam"
    lead="Backend fejlesztő, aki szereti, ha a rendszer évekig is áttekinthető marad."
  />
  <div class="grid">
    <div class="story" appReveal>
      @for (paragraph of profile.letter; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
    <app-card appReveal="2">
      <dl>
        @for (fact of facts; track fact.label) {
          <div>
            <dt>{{ fact.label }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        }
      </dl>
    </app-card>
  </div>
</section>
