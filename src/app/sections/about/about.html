<section id="rolam">
  <app-section-heading [title]="content().ui.about.title" [lead]="content().ui.about.lead" />
  <div class="grid">
    <div class="story" appReveal>
      @for (paragraph of content().profile.letter; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
    <app-card appReveal="2">
      <dl>
        @for (fact of facts(); track fact.label) {
          <div>
            <dt>{{ fact.label }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        }
      </dl>
    </app-card>
  </div>
</section>
